name: Sync changes to destination folder

on:
  push:
    branches: [main]
    paths-ignore:
      - 'destination/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  DEST_DIR: destination

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy only the changed files
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git ls-files | sed 's/^/A\t/' > /tmp/changes.txt
          else
            git diff --name-status --no-renames "$BEFORE" "$AFTER" > /tmp/changes.txt
          fi

          while IFS=$'\t' read -r status path; do
            case "$path" in .github/*|"$DEST_DIR"/*) continue ;; esac
            case "$status" in
              A|M)
                mkdir -p "$DEST_DIR/$(dirname "$path")"
                cp "$path" "$DEST_DIR/$path"
                ;;
              D)
                rm -f "$DEST_DIR/$path"
                ;;
            esac
          done < /tmp/changes.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "$DEST_DIR"
          if git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi
          git commit -m "Sync changes to $DEST_DIR from ${{ github.sha }}"
          git pull --rebase origin main
          git push origin HEAD:main
