name: Sync changes to target repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_REPO: saurabhsitap01/test-repo   # prod: COMPANY/REPO_NAME
  TARGET_BRANCH: sync-test                # prod: main (or whatever you need)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.TARGET_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: target

      - name: Switch to target branch
        run: |
          cd target
          git fetch origin "$TARGET_BRANCH" 2>/dev/null \
            && git checkout "$TARGET_BRANCH" \
            || git checkout -b "$TARGET_BRANCH"

      - name: Apply only the changed files
        run: |
          cd source
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git ls-files | sed 's/^/A\t/' > ../changes.txt
          else
            git diff --name-status --no-renames "$BEFORE" "$AFTER" > ../changes.txt
          fi
          cd ..

          while IFS=$'\t' read -r status path; do
            case "$path" in .github/*) continue ;; esac
            case "$status" in
              A|M)
                mkdir -p "target/$(dirname "$path")"
                cp "source/$path" "target/$path"
                ;;
              D)
                rm -f "target/$path"
                ;;
            esac
          done < changes.txt

      - name: Commit and push
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi
          git commit -m "Sync from ${{ github.repository }}@${{ github.sha }}"
          git push origin "$TARGET_BRANCH"
